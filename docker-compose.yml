version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: swiftremit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swiftremit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: swiftremit_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: swiftremit_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro  # file-to-file mount

  tigerbeetle_single:
    image: ghcr.io/tigerbeetle/tigerbeetle
    command: "start --addresses=0.0.0.0:3333 /data/single.tigerbeetle"
    ports:
      - "3333:3333"
    volumes:
      - ${PWD}/data:/data
    security_opt:
      - "seccomp=unconfined"
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: swiftremit_api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    depends_on:
      - postgres
      - redis
      - tigerbeetle_single


volumes:
  postgres_data:
  redis_data:


