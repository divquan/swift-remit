version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: swiftremit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swiftremit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
      
  prometheus:
    image: prom/prometheus:latest
    container_name: swiftremit_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro  # file-to-file mount

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: dev   # 👈 use dev stage for hot reload

    container_name: swiftremit_api_gateway
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    depends_on:
      - postgres
      - kafka

    develop:
      watch:
        - path: ./api-gateway
          action: sync
          target: /app
          ignore:
            - node_modules/
        - path: ./api-gateway/package.json
          action: rebuild

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      target: dev  # Use dev stage for hot reload

    container_name: swiftremit_orchestrator
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./orchestrator/.env
    depends_on:
      - postgres
      - kafka

    develop:
      watch:
        - path: ./orchestrator
          action: sync
          target: /app
          ignore:
            - node_modules/
        - path: ./orchestrator/package.json
          action: rebuild

  audit-logger:
    build:
      context: ./audit-logger
      dockerfile: Dockerfile
      target: dev  # Use dev stage for hot reload

    container_name: swiftremit_audit_logger
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - ./audit-logger/.env
    depends_on:
      - postgres
      - kafka

    develop:
      watch:
        - path: ./audit-logger
          action: sync
          target: /app
          ignore:
            - node_modules/
        - path: ./audit-logger/package.json
          action: rebuild

volumes:
  postgres_data:



